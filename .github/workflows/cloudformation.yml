name: CloudFormation checks

on:
  pull_request:
  push:
    branches:
      - cloudformation

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install cfn-lint
        run: pip install cfn-lint

      - name: Run cfn-lint
        run: cfn-lint cloudformation/templates/*.yaml

      - name: Check shell syntax
        run: bash -n cloudformation/scripts/*.sh

